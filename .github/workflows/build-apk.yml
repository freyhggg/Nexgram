name: NEXGRAM APK Build

# Збирає повний APK NEXGRAM (з нативними бібліотеками) на GitHub Actions.
# Потрібні власні Telegram API ключі: додай секрети репозиторію
#   TG_API_ID   (число з https://my.telegram.org/apps)
#   TG_API_HASH (рядок з https://my.telegram.org/apps)
# Без секретів збірка використає публічні тестові ключі Telegram (APP_ID=4)
# і працюватиме, але Telegram може обмежувати такі збірки.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK 27.2 and CMake 3.22.1 (via preinstalled SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Inject Telegram API credentials (optional)
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "TG_API_ID/TG_API_HASH не задані — збірка з публічними тестовими ключами Telegram (APP_ID=4)."
            exit 0
          fi
          python3 - <<'PY'
          import os, re
          path = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          src = open(path).read()
          src = src.replace("public static int APP_ID = 4;",
                            "public static int APP_ID = " + os.environ["TG_API_ID"] + ";")
          src = re.sub(r'public static String APP_HASH = "[^"]*";',
                       'public static String APP_HASH = "' + os.environ["TG_API_HASH"] + '";', src)
          open(path, "w").write(src)
          print("Telegram API credentials injected into BuildVars.java")
          PY

      - name: Build NEXGRAM (afat debug)
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexgram-apk
          path: |
            TMessagesProj_App/build/outputs/apk/afat/debug/*.apk
            TMessagesProj_App/afat/debug/*.apk
          if-no-files-found: error
